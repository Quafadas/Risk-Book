site_name: ILS Risk Conformance Suite
site_description: A language-neutral specification and test corpus for ILS risk calculations
repo_url: https://github.com/OWNER/ils-conformance
edit_uri: edit/main/

theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, content.action.edit]
  palette:
    - scheme: default
      primary: black
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: black
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Specification: spec.md
  - Results: results.md
  - Glossary: glossary.md
  - Specs:
      - Expected loss: specs/ExpectedLoss.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.highlight
  # Renders the $$...$$ blocks in docs/specs/. Ships with mkdocs-material.
  - pymdownx.arithmatex: { generic: true }

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

strict: true
