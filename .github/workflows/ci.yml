name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate. A malformed corpus means the question being asked is wrong, so there
  # is no point running any implementation against it.
  check-malformed-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/check_corpus.py
      - run: python tools/check_independence.py
      - name: Validate cases against schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile conformance/schema/case.schema.json \
            conformance/cases/**/*.json

  python:
    needs: check-malformed-corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv run --project impl/python pytest impl/python/tests -q
      - name: Emit envelope
        run: |
          mkdir -p results
          uv run --project impl/python ils-el \
            conformance/cases/el/mean-ylt-10k.json > results/results-python.json
      - uses: actions/upload-artifact@v4
        with: { name: results-python, path: results/ }

  scala:
    needs: check-malformed-corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v7
        with: { extraMillFiles: "impl/scala/build.mill" }
      - uses: coursier/setup-action@v3
        with:
          # Quoted and in block style: a plain scalar containing a colon inside
          # a flow mapping is ambiguous, and `key:value` without a space after
          # the colon is not a valid flow mapping entry at all.
          jvm: "temurin:25"
          apps: ""
      - name: Bootstrap Mill
        working-directory: impl/scala
        run: |
          curl -fsSL -o mill \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.8/mill-dist-1.1.8-mill.sh
          chmod +x mill
      - name: Test
        working-directory: impl/scala
        run: ./mill test
      - name: Emit envelope
        working-directory: impl/scala
        env:
          CONFORMANCE_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p ../../results
          # Mill re-emits the forked process's output through its own logger, so
          # a stack trace lands in the redirect target rather than the job log.
          # Printed inline on failure -- deliberately NOT inside ::group::,
          # which the web UI renders collapsed and hides the one thing worth
          # reading.
          ./mill run > ../../results/results-scala.json || {
            echo "--- mill run failed; captured stdout follows ---"
            cat ../../results/results-scala.json
            echo "--- end captured stdout ---"
            exit 1
          }
          # Confirm the envelope is JSON and not Mill's own chatter.
          echo "envelope head:"
          head -c 300 ../../results/results-scala.json
      - uses: actions/upload-artifact@v4
        with: { name: results-scala, path: results/ }

  julia:
    needs: check-malformed-corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "1" }
      - uses: julia-actions/cache@v2
      - run: julia --project=impl/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Emit envelope
        run: |
          mkdir -p results
          julia --project=impl/julia impl/julia/bin/run.jl > results/results-julia.json
      - uses: actions/upload-artifact@v4
        with: { name: results-julia, path: results/ }

  # LibreOffice is a DIFFERENT implementation of Excel semantics. This job
  # gates on it; the claim it licenses is about LibreOffice.
  LibreOffice:
    needs: check-malformed-corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
      # Compares formulas, values and named ranges against the builder -- not
      # the archive bytes. An .xlsx is a zip of XML whose bytes depend on the
      # openpyxl version and the platform's deflate implementation, so a byte
      # comparison fails for reasons unrelated to the workbook.
      - name: Check template matches its builder
        run: uv run --project impl/excel python impl/excel/build_template.py --check
      - name: Run
        run: |
          mkdir -p results
          uv run --project impl/excel python impl/excel/runner.py > results/results-excel.json
      - uses: actions/upload-artifact@v4
        with: { name: results-excel, path: results/ }

  # Real Excel via COM. Requires a self-hosted Windows runner with a licensed
  # Office install; GitHub's hosted windows images do not ship Excel. Scheduled
  # rather than per-commit. Divergence from the LibreOffice column is itself a
  # reportable finding, so this job does not gate merges.
  # excel-fidelity:
  #   if: github.event_name == 'schedule'
  #   continue-on-error: true
  #   runs-on: [self-hosted, windows, excel]
  #   needs: check-malformed-corpus
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: pip install openpyxl xlwings
  #     - run: python impl/excel/runner.py --engine com > results-excel-com.json
  #     - uses: actions/upload-artifact@v4
  #       with: { name: results-excel-com, path: results-excel-com.json }

  # The scorecard reports whatever came back, so this runs even when an
  # implementation fails -- but not when the corpus gate failed, because then
  # every measurement is against a corpus we know is malformed.
  # check-malformed-corpus must be listed in `needs`: the `needs` context only
  # carries direct dependencies, and referencing an absent one yields null,
  # which would make this condition false forever.
  docs:
    needs: [check-malformed-corpus, python, scala, julia, LibreOffice]
    if: always() && needs.check-malformed-corpus.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Every implementation's envelope, merged into one directory.
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Generate scorecard
        run: python tools/scorecard.py --results-dir artifacts
      - run: pip install --quiet mkdocs-material
      # Builds on every push and pull request, so a broken docs tree fails the
      # PR rather than only being noticed at deploy time. --strict turns
      # warnings (dead nav entries, missing links) into errors.
      - name: Build
        run: mkdocs build --strict
      # Packages site/ as the `github-pages` artifact for the deploy job.
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  # Deployment is a separate job so it can hold the narrow permissions Pages
  # needs, and so `docs` stays runnable on pull requests from forks.
  # Requires Settings -> Pages -> Source = "GitHub Actions".
  publish:
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write        # create a Pages deployment
      id-token: write     # OIDC token deploy-pages exchanges for one
    # Not the workflow-wide group: that one cancels in progress, and a
    # cancelled deployment can leave the site half-updated.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
