[project]
name = "ils-el-excel"
version = "1.0.0"
description = "Excel harness for the ILS risk conformance spec"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
ils-el-excel = "runner:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["runner.py", "build_template.py"]
