[project]
name = "ils-el-python"
version = "1.0.0"
description = "Reference implementation of the ILS risk conformance spec"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ils-el = "ils_el.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ils_el"]

[tool.pytest.ini_options]
testpaths = ["tests"]
